<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências — Bora</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="flex min-h-screen flex-col bg-orange-50 text-gray-800">
    <header class="border-b border-gray-200 bg-white">
      <div class="mx-auto max-w-6xl p-4 sm:flex sm:items-center sm:justify-between">
        <a href="index.html" class="text-3xl font-bold text-bora">Bora</a>
        <nav class="mt-4 flex flex-wrap gap-2 text-sm text-bora sm:mt-0">
          <a href="index.html">Descobrir</a>
          <a href="mapa.html">Mapa</a>
          <a href="favoritos.html">Favoritos</a>
          <a href="preferencias.html" class="bg-bora-light font-bold">Preferências</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto w-full max-w-2xl flex-1 p-4">
      <section class="my-6 rounded-lg bg-bora-light p-6">
        <h1 class="text-3xl font-bold text-bora">Preferências</h1>
        <p class="mt-3">Escolha as categorias de passeio e a distância que você prefere.</p>
      </section>
      <form class="rounded-lg border border-gray-200 bg-white p-4">
        <label for="preferred-distance">Distância máxima</label>
        <select id="preferred-distance">
          <option>5 km</option>
          <option>10 km</option>
          <option>20 km</option>
        </select>
        <fieldset class="my-4">
          <legend class="font-bold">Categorias favoritas</legend>
          <label class="mt-2 block">
            <input type="checkbox"> Ao ar livre
          </label>
          <label class="mt-2 block">
            <input type="checkbox"> Cultura
          </label>
          <label class="mt-2 block">
            <input type="checkbox"> Comida
          </label>
        </fieldset>
        <button type="button" class="rounded-lg bg-bora px-4 py-2 font-bold text-white">Salvar</button>
      </form>
    </main>

    <footer class="mt-12 bg-bora p-6 text-center text-sm text-white">
      Bora · Projeto da disciplina Web 2
    </footer>
  </body>
</html>
