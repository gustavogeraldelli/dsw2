<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências — Bora</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/preferences.js" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-orange-50 text-gray-800">
    <header class="border-b border-gray-200 bg-white">
      <div class="relative mx-auto max-w-6xl p-4 md:flex md:items-center md:justify-between">
        <a href="index.html" class="inline-block text-3xl font-bold text-bora">Bora</a>
        <nav class="responsive-navbar text-sm text-bora">
          <label id="label-dropdown-navbar-menu" for="checkbox-dropdown-navbar-menu">
            <i class="material-icons navbar-menu-icon">menu</i>
          </label>
          <input type="checkbox" id="checkbox-dropdown-navbar-menu">
          <ul class="gap-2">
            <li>
              <a href="index.html">Descobrir</a>
            </li>
            <li>
              <a href="mapa.html">Mapa</a>
            </li>
            <li>
              <a href="favoritos.html">Favoritos</a>
            </li>
            <li>
              <a href="preferencias.html" class="bg-bora-light font-bold">Preferências</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="mx-auto w-full max-w-2xl flex-1 p-4">
      <section class="my-6 rounded-lg bg-bora-light p-4 sm:p-6">
        <h1 class="text-2xl font-bold text-bora sm:text-3xl">Preferências</h1>
        <p class="mt-3">Escolha as categorias de passeio e a distância que você prefere.</p>
      </section>
      <form id="preferences-form" class="rounded-lg border border-gray-200 bg-white p-4">
        <label for="preferred-distance">Distância máxima</label>
        <select id="preferred-distance">
          <option value="5">5 km</option>
          <option value="10">10 km</option>
          <option value="20">20 km</option>
        </select>
        <fieldset class="my-4">
          <legend class="font-bold">Categorias favoritas</legend>
          <label class="mt-2 block">
            <input type="checkbox" name="category" value="Ao ar livre"> Ao ar livre
          </label>
          <label class="mt-2 block">
            <input type="checkbox" name="category" value="Cultura"> Cultura
          </label>
          <label class="mt-2 block">
            <input type="checkbox" name="category" value="Comer"> Comida
          </label>
        </fieldset>
        <button type="submit" class="rounded-lg bg-bora px-4 py-2 font-bold text-white">Salvar</button>
        <p id="preferences-status" class="mt-3 text-sm"></p>
      </form>
    </main>

    <footer class="mt-12 bg-bora p-6 text-center text-sm text-white">
      Bora · Projeto da disciplina Web 2
    </footer>
  </body>
</html>
