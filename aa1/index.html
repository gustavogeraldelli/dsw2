<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrir — Bora</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/places.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-orange-50 text-gray-800">
    <header class="border-b border-gray-200 bg-white">
      <div class="mx-auto max-w-6xl p-4 sm:flex sm:items-center sm:justify-between">
        <a href="index.html" class="text-3xl font-bold text-bora">Bora</a>
        <nav class="mt-4 flex flex-wrap gap-2 text-sm text-bora sm:mt-0">
          <a href="index.html" class="bg-bora-light font-bold">Descobrir</a>
          <a href="mapa.html">Mapa</a>
          <a href="favoritos.html">Favoritos</a>
          <a href="preferencias.html">Preferências</a>
        </nav>
      </div>
    </header>

    <main class="flex-1">
      <section class="bg-bora-light py-12 sm:py-16">
        <div class="mx-auto max-w-6xl px-4">
          <h1 class="text-3xl font-bold text-bora sm:text-4xl">O que fazer hoje?</h1>
          <p class="mt-3 text-gray-600">Escolha os filtros para ver algumas sugestões de passeio.</p>
          <form id="filters" class="mt-6 grid gap-4 rounded-lg bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-4">
            <div>
              <label class="text-sm font-bold" for="category">Categoria</label>
              <select id="category">
                <option value="all">Todas</option>
                <option>Ao ar livre</option>
                <option>Comer</option>
                <option>Cultura</option>
              </select>
            </div>
            <div>
              <label class="text-sm font-bold" for="distance">Distância</label>
              <select id="distance">
                <option value="5">Até 5 km</option>
                <option value="10">Até 10 km</option>
              </select>
            </div>
            <div>
              <label class="text-sm font-bold" for="price">Preço</label>
              <select id="price">
                <option value="999">Qualquer valor</option>
                <option value="0">Grátis</option>
                <option value="50">Até R$ 50</option>
              </select>
            </div>
            <button type="submit" class="self-end rounded-lg bg-bora p-2 font-bold text-white hover-bora">Ver sugestões</button>
          </form>
        </div>
      </section>

      <section class="bg-orange-50 py-10">
        <div class="mx-auto max-w-6xl px-4">
          <h2 class="text-2xl font-bold">Sugestões</h2>
          <p id="result-count" class="mt-2 mb-4 text-sm"></p>
          <div id="places-list" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
          <p id="no-results" hidden>Nenhum lugar corresponde a esses filtros. Tente outra combinação.</p>
        </div>
      </section>
    </main>

    <footer class="bg-bora p-6 text-center text-sm text-white">
      Bora · Projeto da disciplina Web 2
    </footer>
  </body>
</html>
