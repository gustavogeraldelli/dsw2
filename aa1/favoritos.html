<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos — Bora</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/places.js" defer></script>
    <script src="js/location.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-orange-50 text-gray-800">
    <header class="border-b border-gray-200 bg-white">
      <div class="relative mx-auto max-w-6xl p-4 md:flex md:items-center md:justify-between">
        <a href="index.html" class="inline-block text-3xl font-bold text-bora">Bora</a>
        <nav class="responsive-navbar text-sm text-bora">
          <label id="label-dropdown-navbar-menu" for="checkbox-dropdown-navbar-menu">
            <i class="material-icons navbar-menu-icon">menu</i>
          </label>
          <input type="checkbox" id="checkbox-dropdown-navbar-menu">
          <ul class="gap-2">
            <li>
              <a href="index.html">Descobrir</a>
            </li>
            <li>
              <a href="mapa.html">Mapa</a>
            </li>
            <li>
              <a href="favoritos.html" class="bg-bora-light font-bold">Favoritos</a>
            </li>
            <li>
              <a href="preferencias.html">Preferências</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 p-4">
      <section class="my-6 rounded-lg bg-bora-light p-4 sm:p-6">
        <h1 class="text-2xl font-bold text-bora sm:text-3xl">Favoritos</h1>
        <p class="mt-3">Os lugares que você guardou para visitar depois.</p>
      </section>
      <p id="favorite-count" class="my-4 text-sm"></p>
      <div id="favorites-list" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
      <section id="empty-favorites" class="rounded-lg border border-gray-200 bg-white p-4" hidden>
        <h2 class="text-xl font-bold">Nenhum lugar salvo ainda</h2>
        <p class="my-2">Encontrou um lugar interessante? Toque em Favoritar para guardar aqui.</p>
        <a href="index.html" class="text-bora underline">Ver lugares</a>
      </section>
    </main>

    <footer class="mt-12 bg-bora p-6 text-center text-sm text-white">
      Bora · Projeto da disciplina Web 2
    </footer>
  </body>
</html>
